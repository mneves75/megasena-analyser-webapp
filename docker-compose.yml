# ============================================================================
# Development Docker Compose Configuration
# Uses the pinned Bun Alpine runtime from Dockerfile
# Usage: docker compose up
# ============================================================================

services:
  # Main application - runs both Next.js and Bun API server
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Enable BuildKit for better caching and performance
      args:
        BUILDKIT_INLINE_CACHE: 1
    container_name: megasena-analyser
    ports:
      # Expose Next.js only on localhost:3000 (maps to container port 80)
      - "127.0.0.1:3000:80"
      # Expose Bun API only on localhost:3301 for local diagnostics
      - "127.0.0.1:3301:3201"
    environment:
      - NODE_ENV=production
      - PORT=80
      - API_PORT=3201
      # Within container, both servers run on localhost
      - API_HOST=localhost
      - DATABASE_PATH=/app/db/mega-sena.db
      - NEXT_PUBLIC_BASE_URL=http://localhost:3000
      - NEXT_TELEMETRY_DISABLED=1
      # LGPD: HMAC secret for IP pseudonymization (min 32 chars).
      # Production refuses to start without it. Generate with:
      #   openssl rand -hex 32
      # Provide via shell env or .env file (never commit the value).
      - "IP_HASH_SECRET=${IP_HASH_SECRET:?IP_HASH_SECRET is required for LGPD pseudonymization; generate with openssl rand -hex 32}"
    volumes:
      # Persist SQLite database across container restarts
      - ./db:/app/db
    restart: unless-stopped
    # The app never needs privilege escalation (setuid binaries etc.).
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Health check using Bun without a shell
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3201/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    # Resource limits (optimized for Bun runtime)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 384M
        reservations:
          cpus: '0.25'
          memory: 192M

  # Optional: Caddy reverse proxy for local testing
  # Start with: docker compose --profile with-proxy up
  caddy:
    image: caddy:2-alpine
    container_name: megasena-caddy
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - with-proxy  # Only start when explicitly requested

volumes:
  caddy_data:
    name: megasena_caddy_data
  caddy_config:
    name: megasena_caddy_config

# Network configuration (using default bridge network)
networks:
  default:
    name: megasena_network
