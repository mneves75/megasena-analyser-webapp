name: Cloudflare Runtime

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/setup-bun-pinned
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
      - name: Install locked dependencies
        run: corepack enable && pnpm install --frozen-lockfile
      - name: Scan secrets and dependencies
        run: |
          bun run security:secrets
          bun run security:braces
          pnpm audit
      - name: Check source
        run: |
          bun run lint
          bun run lint:ast
          bun run typecheck
      - name: Exercise real Workers storage and transport
        run: bun run test:cloudflare
      - name: Verify coverage and Bun SQLite compatibility
        run: |
          bun run test -- --run --coverage
          bun run test:sqlite
      - name: Build the standalone rollback path
        run: bun run build
      - name: Build staging Worker without deployment credentials
        run: bun run build:cloudflare
      - name: Build production Worker without deployment credentials
        run: bun run build:cloudflare:production
      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cloudflare-runtime-evidence
          path: |
            .scratch/cloudflare-database/*-result.json
            .scratch/cloudflare-worker/runtime-result.json
          if-no-files-found: warn
