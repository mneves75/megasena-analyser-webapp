name: CLI Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:

  cli-smoke:
    runs-on: ubuntu-latest
    env:
      CI: "1"
      DATABASE_PATH: "./db/cli-smoke.db"
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-pinned

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Run migration smoke
        run: |
          bun run db:migrate

      - name: Run retention CLIs in dry-run mode
        run: |
          bun run audit:prune -- --days 1 --dry-run
          bun run log:prune -- --days 1 --dry-run
