name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [main]

# Default every job to a read-only token; jobs that stage or publish images
# declare their own elevated permissions explicitly.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # Job 0: Secret Scan
  # ============================================================================
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-pinned

      - name: Scan working tree for secrets
        run: bun run security:secrets

      - name: Scan reachable Git history for secrets
        run: bun run security:secrets:history

  # ============================================================================
  # Job 1: Lint and Type Check
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    needs: [secrets]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-pinned

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Run linter
        run: bun run lint

      - name: Run structural linter
        run: bun run lint:ast

      - name: Type check
        run: bun x tsc --noEmit

  # ============================================================================
  # Job 2: Unit Tests
  # ============================================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-pinned

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Run tests
        run: bun run test -- --run

  # ============================================================================
  # Job 3: E2E Tests
  # ============================================================================
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-pinned

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: bun x playwright install --with-deps chromium

      - name: Run E2E tests
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: bun run test:e2e

  # ============================================================================
  # Job 4: Build Docker Image
  # ============================================================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, e2e]
    timeout-minutes: 20
    outputs:
      digest: ${{ steps.build-push.outputs.digest }}
      tags: ${{ steps.meta.outputs.tags }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-pinned

      - name: Cache dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: corepack enable && pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit

      - name: Build Next.js standalone output
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          bun run build
          bun run dist:standalone
          if [ ! -f dist/standalone/server.js ]; then
            echo "Build failed: dist/standalone/server.js not found"
            exit 1
          fi
          if find dist/standalone -type f \( -name '*.db' -o -name '*.db-shm' -o -name '*.db-wal' \) | grep -q .; then
            echo "Build failed: dist/standalone still contains SQLite artifacts"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build Docker image by digest
        id: build-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      - name: Image digest
        run: echo "${{ steps.build-push.outputs.digest }}"

  # ============================================================================
  # Job 5: Generate SBOM
  # ============================================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Bun
        uses: ./.github/actions/setup-bun-pinned

      - name: Resolve version
        id: version
        run: |
          version="$(bun -p "require('./package.json').version")"
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create SBOM output directory
        run: mkdir -p artifacts/sbom

      - name: Generate SBOM (CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          output-file: artifacts/sbom/${{ steps.version.outputs.version }}.json
          upload-artifact: false

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ steps.version.outputs.version }}
          path: artifacts/sbom/${{ steps.version.outputs.version }}.json
          if-no-files-found: error

  # ============================================================================
  # Job 6: Security Scan
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [build, sbom]
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build.outputs.digest }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          limit-severities-for-sarif: true

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # Job 7: Publish Scanned Image
  # ============================================================================
  publish:
    name: Publish Scanned Image
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote scanned digest to release tags
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE_TAGS: ${{ needs.build.outputs.tags }}
          PROMOTION_METADATA: ${{ runner.temp }}/promotion-metadata.json
        run: |
          source_ref="${REGISTRY}/${IMAGE_NAME}@${IMAGE_DIGEST}"
          tag_args=()

          while IFS= read -r image_tag; do
            if [ -n "$image_tag" ]; then
              tag_args+=(--tag "$image_tag")
            fi
          done <<< "$IMAGE_TAGS"

          if [ "${#tag_args[@]}" -eq 0 ]; then
            echo "Image promotion failed: no release tags were generated."
            exit 1
          fi

          docker buildx imagetools create \
            --prefer-index=false \
            --metadata-file "$PROMOTION_METADATA" \
            "${tag_args[@]}" \
            "$source_ref"

          promoted_digest="$(jq -r '."containerimage.descriptor".digest' "$PROMOTION_METADATA")"
          if [ "$promoted_digest" != "$IMAGE_DIGEST" ]; then
            echo "Image promotion failed: promoted digest does not match scanned digest."
            exit 1
          fi

          echo "Published scanned image digest: $promoted_digest"
